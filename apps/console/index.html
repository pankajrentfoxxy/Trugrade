<!doctype html>
<html lang="en" data-t="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Console pre-paint read. Light everywhere. A first paint on /vendor/* and
      /sell/*, /login, /forgot-password and /team/accept already carry the supplier hub surface, so neither the admin
      palette nor the dark masthead flashes.
    -->
    <script>try{document.documentElement.setAttribute('data-t','light');localStorage.setItem('tg-console-theme','light');var p=location.pathname;if(p.indexOf('/vendor')===0||p.indexOf('/sell')===0||p.indexOf('/login')===0||p.indexOf('/forgot-password')===0||p.indexOf('/team/accept')===0){document.documentElement.setAttribute('data-surface','hub');document.documentElement.setAttribute('data-density','default')}}catch(e){}</script>
    <title>Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
