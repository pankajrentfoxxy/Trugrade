<!doctype html>
<html lang="en" data-t="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!--
      Console pre-paint read. Light everywhere. A first paint on /vendor/* already
      carries the MANIFEST surface so the admin palette never flashes.
    -->
    <script>try{document.documentElement.setAttribute('data-t','light');localStorage.setItem('tg-console-theme','light');if(location.pathname.indexOf('/vendor')===0){document.documentElement.setAttribute('data-surface','manifest');document.documentElement.setAttribute('data-density','default')}}catch(e){}</script>
    <title>Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
