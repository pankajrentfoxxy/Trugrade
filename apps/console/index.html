<!doctype html>
<html lang="en" data-t="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Devanagari:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!--
      Console pre-paint read. Verbatim copy of `THEME_CONSOLE_PREPAINT_SCRIPT`
      from `@trugrade/ui` — dark in the shell, light on /login and /sell/register.
    -->
    <script>try{var p=location.pathname;if(p==='/login'||p==='/sell/register'||p.indexOf('/sell/register/')===0){document.documentElement.setAttribute('data-t','light')}else{var t=localStorage.getItem('tg-console-theme')||localStorage.getItem('tg-theme');if(t==='dark'||t==='slate'||t==='olive'||t==='sand'){document.documentElement.setAttribute('data-t',t);if(!localStorage.getItem('tg-console-theme'))localStorage.setItem('tg-console-theme',t)}else{document.documentElement.setAttribute('data-t','dark');localStorage.setItem('tg-console-theme','dark')}}}catch(e){}</script>
    <title>Console</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
